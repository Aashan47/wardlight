[project]
name = "wardlight"
version = "0.0.0"
description = "Which critical sites in a grid-isolated city to put on their own solar and battery, from public data."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "rapidfuzz>=3.9",
  "pytesseract>=0.3.13",
  "pypdfium2>=4.30",
  "scipy>=1.14",
  "pyarrow>=17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "engine", "agents", "data_build"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]
# only for rebuilding the data from the raw downloads (data_build/)
build = ["rasterio>=1.4", "affine>=2.4", "opencv-python-headless>=4.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
