[project]
name = "wardlight"
version = "0.0.0"
description = "Vaccine-fridge uptime and solar sizing for health facilities, from public data."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "rapidfuzz>=3.9",
  "pytesseract>=0.3.13",
  "pypdfium2>=4.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "engine", "data_build"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
